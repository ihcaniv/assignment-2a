# Identities (certificates and keys) for the demo network, generated by
# `cryptogen` when the network first starts. Output goes to fabric/organizations/
# (gitignored).
#
# cryptogen suits development and demos. A production network would issue
# identities from each organisation's own Fabric CA, so staff certificates can
# be enrolled, renewed and revoked.

OrdererOrgs:
  - Name: Orderer
    Domain: dsw.example
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        SANS: [localhost, 127.0.0.1]

PeerOrgs:
  # The school: issues and revokes skill coins.
  - Name: School
    Domain: school.dsw.example
    EnableNodeOUs: true
    Template:
      Count: 1 # peer0.school.dsw.example
      SANS: [localhost, 127.0.0.1]
    Users:
      Count: 1 # User1@school.dsw.example: the identity the web app signs with

  # Kanavoogle: runs the platform, co-endorses every transaction and verifies credentials.
  - Name: Kanavoogle
    Domain: kanavoogle.dsw.example
    EnableNodeOUs: true
    Template:
      Count: 1 # peer0.kanavoogle.dsw.example
      SANS: [localhost, 127.0.0.1]
    Users:
      Count: 1 # User1@kanavoogle.dsw.example
