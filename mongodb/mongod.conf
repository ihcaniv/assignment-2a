# mongod configuration for a NATIVE install (MongoDB installed with apt/yum,
# no Docker). Copy to /etc/mongod.conf and restart: sudo systemctl restart mongod
# The Docker setup does not use this file.
# Reference: https://www.mongodb.com/docs/manual/reference/configuration-options/

storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      # Roughly 50% of the server's RAM minus 1 GB. Lower it on small VPSs.
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen

net:
  port: 27017
  # Only accept connections from this machine. If the Next.js app runs on a
  # different server, append this server's PRIVATE IP (e.g. 127.0.0.1,10.0.0.5)
  # and allow port 27017 from the app server only in your firewall.
  bindIp: 127.0.0.1
  # Enable TLS before allowing connections over an untrusted network:
  # tls:
  #   mode: requireTLS
  #   certificateKeyFile: /etc/ssl/mongodb/server.pem

security:
  # Every client must log in. Create the admin user BEFORE turning this on
  # (see mongodb/README.md, "Native install").
  authorization: enabled

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
